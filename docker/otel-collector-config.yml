receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: 'spring-boot-app'
          scrape_interval: 5s
          metrics_path: '/actuator/prometheus'
          static_configs:
            - targets: ['host.docker.internal:9001']

exporters:
  prometheus:
    endpoint: "0.0.0.0:9464"


service:
  pipelines:
    metrics:
      receivers: [prometheus]
      exporters: [prometheus]

